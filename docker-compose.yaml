# Single-container Airflow (SequentialExecutor + SQLite via `airflow
# standalone`) for running the network_security_event_pipeline DAG locally.
# Not how you'd run Airflow in production -- see README.md.
#
# Usage:
#   docker compose build
#   docker compose up
#   # UI at http://localhost:8081 -- credentials print in the container logs
#   # on first boot (`grep password` in the logs, or check
#   # airflow_home/standalone_admin_password.txt via `docker compose exec`).
#   # (8081, not 8080: this machine already has an unrelated Airflow stack
#   # from another project bound to 8080.)
services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: network-security-airflow
    command: standalone
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_ROOT: /opt/airflow/project
      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT:-}
      BIGQUERY_DATASET: ${BIGQUERY_DATASET:-network_security}
      BIGQUERY_LOCATION: ${BIGQUERY_LOCATION:-US}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/${GOOGLE_CREDENTIALS_FILE:-application_default_credentials.json}
    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./jobs:/opt/airflow/project/jobs:ro
      - ./validation:/opt/airflow/project/validation:ro
      - ./scripts:/opt/airflow/project/scripts:ro
      - ./data:/opt/airflow/project/data
      - ${GOOGLE_ADC_DIR:-~/.config/gcloud}:/opt/airflow/gcp:ro
      - ~/.kaggle:/home/airflow/.kaggle:ro

volumes:
  airflow_home:
